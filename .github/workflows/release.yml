name: Publish

on:
  push:
    branches:
      - main

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  GITHUB_ACTIONS: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      Version: ${{ steps.gitversion.outputs.SemVer }}
      CommitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.x
            8.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.10.2
        with:
          versionSpec: 5.x

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v0.10.2
        id: gitversion

      - name: Display GitVersion outputs
        run: |
          echo "Version: ${{ steps.gitversion.outputs.SemVer }}"
          echo "CommitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }}"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal || echo "No tests found"

      - name: Build and Pack NuGet package
        run: >
          dotnet pack NetVaultSdk/NetVaultSdk.csproj
          --configuration Release
          -p:Version='${{ steps.gitversion.outputs.SemVer }}'
          -p:ContinuousIntegrationBuild=true
          -p:IncludeSymbols=true
          -p:SymbolPackageFormat=snupkg
          --no-build
          --output ./Package

      - name: Upload NuGet artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: libPackage
          path: ./Package
  
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.build.outputs.CommitsSinceVersionSource > 0
    needs: build
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download lib nuget package artifact
        uses: actions/download-artifact@v4
        with:
          name: libPackage
          path: ./libPackage

      - name: Push package to Nuget
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "${NUGET_API_KEY}" ]; then echo "NUGET_API_KEY not set, skipping push"; exit 0; fi
          dotnet nuget push libPackage/*.nupkg --api-key "${NUGET_API_KEY}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          if compgen -G "libPackage/*.snupkg" > /dev/null; then dotnet nuget push libPackage/*.snupkg --api-key "${NUGET_API_KEY}" --source https://api.nuget.org/v3/index.json --skip-duplicate; fi

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.build.outputs.Version }}
          name: Release ${{ needs.build.outputs.Version }}
          artifacts: "libPackage/*"
          token: ${{ secrets.GITHUB_TOKEN }}